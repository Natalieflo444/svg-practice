<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a surfboard</title>
  <desc id="desc">A white pelican catching a wave on a classic wooden surfboard at golden sunset.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.3" stop-color="#feca57"/>
      <stop offset="0.6" stop-color="#ff9ff3"/>
      <stop offset="1" stop-color="#5f27cd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d2d3"/>
      <stop offset="0.5" stop-color="#0abde3"/>
      <stop offset="1" stop-color="#1e3799"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff9c4"/>
      <stop offset="0.6" stop-color="#ffd36e"/>
      <stop offset="1" stop-color="#ffd36e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7355"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#654321"/>
    </linearGradient>
    <radialGradient id="pelicanBody" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="700" cy="100" r="50" fill="url(#sunG)"/>
  <circle cx="700" cy="100" r="20" fill="#ffd36e"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.7">
    <path d="M60 50c0-16 12-28 28-28 8 0 16 2 22 5 5-14 19-22 33-22 20 0 36 16 36 36H60z"/>
    <path d="M200 80c0-12 10-22 22-22 5 0 9 2 12 4 4-11 16-18 28-18 17 0 31 13 31 30H200z"/>
  </g>

  <!-- ocean -->
  <path d="M0 450c70-20 140 15 210 10 70-5 140-40 210-38 70 2 140 35 210 30 40-2 80-8 120-20v160H0z" fill="url(#sea)"/>

  <!-- breaking wave -->
  <path d="M0 500c80-35 150-45 220-20 70 25 140 40 210 30 70-10 140-35 210-45 40-8 80-10 120-8v118H0z" fill="#3ddad7" opacity="0.8"/>

  <!-- foam -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M40 520c10-12 20-18 30-20 15-3 25-12 35-22z"/>
    <path d="M130 530c8-10 16-16 24-18 12-2 20-10 28-18z"/>
    <path d="M220 540c6-8 12-12 18-14 9-2 15-8 21-14z"/>
  </g>

  <!-- surfboard -->
  <g transform="translate(400 470) rotate(-8)">
    <!-- board -->
    <path d="M-180 0C-145-25 55-21 175 0 55 21 -145 25 -180 0Z" fill="url(#board)"/>
    <path d="M-180 0C-145-25 55-21 175 0 55 21 -145 25 -180 0Z" fill="none" stroke="#4a3b28" stroke-width="2" stroke-linejoin="round"/>

    <!-- rail line -->
    <path d="M-160 -8C-130-20 30-18 150 -4" fill="none" stroke="#d2691e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- fin -->
    <path d="M-30 12 L -18 48 L 4 12 Z" fill="#2d3436"/>

    <!-- splash behind -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="-150" cy="-35" r="6"/>
      <circle cx="-170" cy="-20" r="4"/>
      <circle cx="-190" cy="-30" r="5"/>
    </g>
  </g>

  <!-- pelican -->
  <g>
    <!-- far wing -->
    <path d="M-38 -126C-98 -156 -154 -138 -144 -96c18 18 64 14 96 0 14-14 18-34 12-44z" fill="#d0c4b0"/>
    <g fill="none" stroke="#a8a292" stroke-width="4" stroke-linecap="round">
      <path d="M-44 -120c32-16 66-16 90 0"/>
      <path d="M-40 -100c28-12 52-8 68 4"/>
    </g>

    <!-- tail -->
    <path d="M-74 -98c-22-8-44 4-58 20 20-20 32-14 42-8 10 6 14 20 18 32z" fill="#e8d8c8"/>

    <!-- legs -->
    <g stroke="#f39c12" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M-30 -50 L -36 -18 L -44 -10"/>
      <path d="M30 -48 L 36 -16 L 14 -8"/>
    </g>
    <g fill="#f39c12">
      <path d="M-44 -12c-10 2-18 6-22 12 10 2 22-2 30-6z"/>
      <path d="M32 -10c10 0 18 6 22 12-10 2-22 0-30-6z"/>
    </g>

    <!-- body -->
    <ellipse cx="0" cy="-98" rx="82" ry="62" fill="url(#pelicanBody)" transform="rotate(-6 0 -98)"/>
    <path d="M-78 -88c18 16 56 24 94 8 6-20-10 42-44 44-42 2-68-18-68-52z" fill="#cfc4ab" opacity="0.4"/>

    <!-- neck -->
    <path d="M32 -124C54 -134 60 -154 64 -172" fill="none" stroke="#f3ecdb" stroke-width="44" stroke-linecap="round"/>

    <!-- head -->
    <ellipse cx="72" cy="-194" rx="46" ry="40" fill="url(#pelicanBody)" transform="rotate(-7 72 -194)"/>

    <!-- beak -->
    <path d="M118 -192 L 266 -178 L 118 -164 Z" fill="#f6b93b"/>
    <path d="M118 -164 L 264 -178 C 224 -142 142 -140 118 -164 Z" fill="#e55039"/>
    <path d="M118 -164 L 266 -178 L 122 -170 Z" fill="#fff3b0"/>
    <circle cx="122" cy="-178" r="3.5" fill="#2d3436"/>

    <!-- eye -->
    <circle cx="76" cy="-208" r="9" fill="#fff"/>
    <circle cx="78" cy="-208" r="5.5" fill="#2d3436"/>
    <circle cx="80" cy="-210" r="2" fill="#fff"/>

    <!-- near wing -->
    <path d="M26 -138C88 -178 154 -170 172 -130c-14 32-36 56-78 52-30-3-60-2-84 6z" fill="#fbf7ea"/>
    <g fill="none" stroke="#d5c9b0" stroke-width="5" stroke-linecap="round">
      <path d="M60 -148c32-16 64-16 86 0"/>
      <path d="M62 -128c30-14 58-10 76 4"/>
    </g>
  </g>
</svg>